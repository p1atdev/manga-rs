[package]
name = "manga-image-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
manga-image = { version = "0.1.0", path = "../manga-image", features = ["comici", "magapoke", "fuz", "kadokomi", "direct-sort"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
