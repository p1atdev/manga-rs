[package]
name = "cli"
version = "0.1.0"
edition = "2024"
description = "CLI for processing manga viewer images"
license = "Apache-2.0"

[[bin]]
name = "manga"
path = "src/main.rs"

[features]
default = ["direct-sort"]
direct-sort = ["manga/direct-sort"]

[dependencies]
manga = { path = "../manga", version = "0.1.0", default-features = false, features = ["comici", "giga", "kadokomi", "fuz", "magapoke", "piccoma", "yanmaga"] }

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
url = "2.5.8"
zip = "8.6.0"
image = "0.25.10"
tokio = "1.53.1"
serde_json = "1.0.151"
tempfile = "3"

[dev-dependencies]
sha2 = "0.11"
