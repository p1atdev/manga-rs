[package]
name = "manga"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "manga"
path = "src/lib.rs"


[features]
default = ["comici", "giga", "kadokomi"]

comici = ["manga-image/comici"]
giga = ["dep:feed-rs"]
kadokomi = ["dep:hex", "manga-image/kadokomi"]
fuz = ["manga-image/fuz", "dep:prost", "dep:prost-build", "dep:aes", "dep:hex", "dep:cbc", "dep:cipher", "dep:cookie", "reqwest/cookies"]
mangaz = []
piccoma = []
magapoke = ["manga-image/magapoke", "dep:sha2", "dep:hex"]
yanmaga = ["reqwest/cookies"]
# Lossless JPEG coefficient tile swap for giga (bundled mozjpeg C sources, needs a C compiler).
direct-sort = ["manga-image/direct-sort", "giga"]

[dependencies]
manga-image = { version = "0.1.0", path = "../manga-image", default-features = false }
anyhow = "1.0.104"
image = "0.25.10"
crc32fast = "1.5"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.34"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
indicatif = { version = "0.18.6", features = ["futures", "tokio"] }
zip = "8.6.0"
num_cpus = "1.17.0"
regex = "1.13.1"
scraper = "0.27.0"

# giga
feed-rs = { version = "2.4.0", optional = true }

# fuz
prost = { version = "0.14.4", optional = true }
aes = { version = "0.9.2", optional = true }
hex = { version = "0.4.3", optional = true }
cbc = { version = "0.2.1", optional = true }
cipher = { version = "0.5.2", features = ["block-padding"], optional = true }
sha2 = { version = "0.11", optional = true }
cookie = { version = "0.18", optional = true }
thiserror = "2.0.20"
libwebp-sys = "0.9.6"

[dev-dependencies]
webp = { version = "0.3.1", default-features = false }

[build-dependencies]
prost-build = { version = "0.14.4", optional = true }

[[example]]
name = "direct_sort_bench"
required-features = ["direct-sort"]
